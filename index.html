<!DOCTYPE html>
<html lang="en" data-theme="copper"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Work</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--acc:#b5652d;--acc2:#d98349;--bg:#0f0e0e;--panel:#171514;--panel2:#1f1c1a;--line:#2e2a27;--text:#ece8e3;--muted:#a39b93;--tint:rgba(181,101,45,.16);--glow:rgba(181,101,45,.24)}
[data-theme="blue"]{--acc:#3a78cf;--acc2:#6aa3f0;--bg:#0c0f14;--panel:#141922;--panel2:#1b2230;--line:#273044;--tint:rgba(58,120,207,.18);--glow:rgba(58,120,207,.26)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(900px 520px at 85% 0,var(--glow),transparent 60%),var(--bg);color:var(--text);font-family:'Fira Sans',system-ui,sans-serif;line-height:1.5;overflow-x:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px;position:relative;z-index:1}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid var(--line);animation:fade .8s both}
.logo{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:1.7rem;letter-spacing:.04em;color:#fff}
.sw{display:flex;align-items:center;gap:9px;font-size:.88rem;color:var(--muted);cursor:pointer;user-select:none}
.sw i{width:46px;height:24px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);position:relative}
.sw i::after{content:"";position:absolute;top:3px;left:4px;width:16px;height:16px;border-radius:50%;background:var(--acc2);transition:.25s}
[data-theme="copper"] .sw i::after{left:25px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:44px;align-items:center;min-height:calc(100vh - 140px);padding:30px 0 50px}
.badge{display:inline-block;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:7px 16px;font-size:.82rem;color:var(--muted);animation:fade .8s .1s both}
h1{font-family:Cinzel,Georgia,serif;font-size:clamp(3.2rem,10vw,6.8rem);line-height:1;margin:22px 0 14px;letter-spacing:.04em;font-weight:700}
h1 span{display:inline-block;opacity:0;transform:translateY(40px) rotateX(70deg);animation:rise .8s cubic-bezier(.2,.9,.3,1.2) forwards}
h1 .w{color:var(--acc2)}
.line{height:3px;width:0;background:linear-gradient(90deg,var(--acc),transparent);border-radius:3px;animation:sweep 1.2s .9s forwards}
.lead{font-size:1.25rem;color:var(--muted);margin:20px 0 0;animation:fade .8s 1s both}.lead b{color:#fff;text-decoration:underline;text-underline-offset:5px}
.cta{margin-top:26px;animation:fade .8s 1.2s both}
.cta a{display:inline-flex;align-items:center;gap:12px;color:#fff;text-decoration:none;font-weight:500}
.cta span{width:38px;height:38px;border-radius:50%;background:var(--acc);display:grid;place-items:center;transition:.3s}
.cta a:hover span{transform:translateX(6px);box-shadow:0 0 0 6px var(--tint)}
.win{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.45);animation:float 6s ease-in-out infinite,fade .9s .4s both}
.win .bar{background:var(--panel2);padding:13px 16px;display:flex;gap:7px}
.win .bar i{width:11px;height:11px;border-radius:50%;background:#c0453a}.win .bar i:nth-child(2){background:#d9a53a}.win .bar i:nth-child(3){background:#4aa35a}
.in{padding:26px 24px 28px}
.in h3{margin:0 0 6px;font-size:1.3rem;font-weight:600}
.in p{margin:0 0 18px;color:var(--muted);font-size:.95rem}
.pills{display:flex;gap:10px;margin-bottom:16px}
.pills button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:600 1.1rem 'Fira Sans',sans-serif;cursor:pointer;transition:.25s}
.pills button:hover{border-color:var(--acc)}
.pills button.on{background:var(--acc);border-color:var(--acc);color:#fff;transform:translateY(-3px);box-shadow:0 8px 20px var(--glow)}
.url{display:block;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px 14px;font-family:ui-monospace,Consolas,monospace;font-size:.86rem;word-break:break-all;color:var(--text);text-decoration:none}
.url em{font-style:normal;font-weight:700;color:var(--acc2);display:inline-block;animation:pop .5s}
.go{display:inline-block;margin-top:18px;padding:11px 26px;border:1px solid var(--text);border-radius:99px;color:#fff;text-decoration:none;font-weight:500;transition:.3s}
.go:hover{background:var(--acc);border-color:var(--acc)}
.pills button{width:auto;min-width:76px;height:auto;padding:9px 14px;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.pills button b{font-size:1.2rem}.pills button small{font-size:.75rem;opacity:.8}
.desc{margin:0 0 12px;padding:10px 14px;background:var(--tint);border-left:3px solid var(--acc2);border-radius:0 8px 8px 0;font-size:.95rem}
.desc.pp{animation:fade .4s}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.chip{display:flex;flex-direction:column;align-items:center;padding:7px 4px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;color:var(--text);text-decoration:none;line-height:1.15;opacity:0;animation:fade .5s forwards;transition:.2s}
.chip b{font-size:.95rem}.chip small{font-size:.68rem;color:var(--muted)}
.chip:hover,.chip:focus{background:var(--acc);border-color:var(--acc);transform:translateY(-3px);outline:0}.chip:hover small,.chip:focus small{color:#fff}
@keyframes rise{to{opacity:1;transform:none}}@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sweep{to{width:220px}}@keyframes float{50%{transform:translateY(-12px)}}@keyframes pop{from{transform:scale(2);opacity:0}}
@media(max-width:860px){.hero{grid-template-columns:1fr;min-height:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}h1 span,.badge,.lead,.cta,.win,.top{opacity:1!important;transform:none!important}.line{width:220px}}
</style></head><body>
<canvas id="fx"></canvas>
<div class="wrap">
<div class="top"><div class="logo">ALEFORGE</div><div class="sw" id="sw">Blue <i></i> Copper</div></div>
<section class="hero"><div>
<span class="badge">Welcome</span>
<h1 id="t"></h1><div class="line"></div>
<p class="lead">Open the bigger page to <b>see the work</b></p>
<div class="cta"><a id="open" href="https://aeriskr.github.io/works/1" target="_blank" rel="noopener"><span>&rarr;</span>Open Work</a></div></div>
<div class="win"><div class="bar"><i></i><i></i><i></i></div><div class="in">
<h3>Wanna see work of month?</h3>
<p>Pick a month. Month 1 starts from September.</p>
<div class="chips" id="chips"></div>
<div class="desc" id="desc"><b>Month 1</b> &middot; September work</div>
<a class="url" id="url" href="https://aeriskr.github.io/works/1" target="_blank" rel="noopener">https://aeriskr.github.io/works/<em>1</em></a>
</div></div></section></div>
<script>
const t=document.getElementById('t');
"MY WORK".split('').forEach((c,i)=>{const s=document.createElement('span');s.textContent=c===' '?'\u00a0':c;if(i>2)s.className='w';s.style.animationDelay=(.25+i*.09)+'s';t.appendChild(s)});
const base='https://aeriskr.github.io/works/';
const M=['September','October','November','December','January','February','March','April','May','June','July','August'];
const ch=document.getElementById('chips'),de=document.getElementById('desc'),ur=document.getElementById('url');
M.forEach((m,i)=>{const n=i+1,a=document.createElement('a');a.className='chip';a.href=base+n;a.target='_blank';a.rel='noopener';
 a.innerHTML='<b>'+n+'</b><small>'+m.slice(0,3)+'</small>';a.style.animationDelay=(1+i*.05)+'s';
 const show=()=>{de.innerHTML='<b>Month '+n+'</b> &middot; '+m+' work';de.classList.remove('pp');void de.offsetWidth;de.classList.add('pp');ur.href=base+n;ur.innerHTML=base+'<em>'+n+'</em>'};
 a.onmouseenter=show;a.onfocus=show;ch.appendChild(a)});
document.getElementById('sw').onclick=()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==='copper'?'blue':'copper'};
const cv=document.getElementById('fx'),x=cv.getContext('2d');let W,H,P=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
for(let i=0;i<60;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+.6,v:Math.random()*.6+.25,d:Math.random()*6,a:Math.random()*.6+.2});
let col='#d98349',f=0;
(function loop(){f++;if(f%30===1)col=getComputedStyle(document.documentElement).getPropertyValue('--acc2').trim();
 x.clearRect(0,0,W,H);x.fillStyle=col;
 P.forEach(p=>{p.y-=p.v;p.d+=.02;p.x+=Math.sin(p.d)*.4;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}
  x.globalAlpha=p.a*(p.y/H);x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()});
 requestAnimationFrame(loop)})();
</script></body></html>
